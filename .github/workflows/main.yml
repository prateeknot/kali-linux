name: Kali Linux RDP via Tailscale

on:
  workflow_dispatch:
    inputs:
      kali_password:
        description: 'Kali Linux Password (for user: kali)'
        required: true
        default: 'kali'   # डिफ़ॉल्ट Kali पासवर्ड

jobs:
  kali-rdp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Kali Linux कंटेनर शुरू करें
      - name: Start Kali Linux Container
        run: |
          docker run -d --name kali-rdp --restart always \
            -p 3390:3390 \
            kalilinux/kali-rolling \
            tail -f /dev/null

      # 2. कंटेनर के अंदर ज़रूरी पैकेज इंस्टॉल करें (XFCE, xrdp)
      - name: Install XFCE, xrdp, and dependencies
        run: |
          docker exec kali-rdp bash -c "
            apt-get update &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              kali-desktop-xfce xorg xrdp xorgxrdp dbus-x11 sudo &&
            sed -i 's/port=3389/port=3390/g' /etc/xrdp/xrdp.ini
          "

      # 3. Kali यूज़र बनाएं और पासवर्ड सेट करें (यहीं पहले एरर आया था)
      - name: Create Kali user and set password
        run: |
          docker exec kali-rdp bash -c "
            # Check if user 'kali' exists, if not create it
            id -u kali &>/dev/null || useradd -m -s /bin/bash kali
            
            # Add kali user to sudo group
            usermod -aG sudo kali
            
            # Set password
            echo 'kali:${{ github.event.inputs.kali_password }}' | chpasswd
          "

      # 4. xrdp सर्विस शुरू करें
      - name: Start xrdp service
        run: |
          docker exec kali-rdp bash -c "
            service dbus start &&
            service xrdp start
          "

      # 5. Tailscale इंस्टॉल और कनेक्ट करें
      - name: Install and connect Tailscale
        run: |
          docker exec kali-rdp bash -c "
            curl -fsSL https://tailscale.com/install.sh | sh &&
            tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }} --hostname kali-rdp-actions
          "

      # 6. कनेक्शन की जानकारी दिखाएं
      - name: Show Connection Details
        run: |
          echo "=================================================="
          echo "   Kali Linux RDP Session Ready"
          echo "=================================================="
          TAILSCALE_IP=$(docker exec kali-rdp tailscale ip -4)
          echo "  Your Kali RDP Address: ${TAILSCALE_IP}:3390"
          echo "  Username             : kali"
          echo "  Password             : ${{ github.event.inputs.kali_password }}"
          echo "=================================================="

      # 7. सेशन को 5 घंटे तक चालू रखें
      - name: Keep Session Alive
        run: |
          echo "Session will stay alive for 5 hours (max allowed by GitHub Actions)."
          sleep 18000  # 5 घंटे = 18000 सेकंड

      # 8. क्लीनअप
      - name: Cleanup
        if: always()
        run: |
          docker stop kali-rdp
          docker rm kali-rdp
